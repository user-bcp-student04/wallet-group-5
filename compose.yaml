name: ai-labs
services:
  auth:
    build: ./auth
    ports:
      - "127.0.0.1:8080:8080"
  api:
    build: ./api
    environment:
      AUTH_HEALTH_URL: http://auth:8080/q/health
      AUTH_JWT_PUBLIC_KEY: ${AUTH_JWT_PUBLIC_KEY:-}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-}
      WORKSHOP_DB_PATH: /data/workshop.db
      WORKSHOP_UPLOAD_DIR: /uploads
      WALLET_MOCK_URL: ${WALLET_MOCK_URL:-http://host.docker.internal:8787}
      ONBOARDING_OTP_TEST_CODE: ${ONBOARDING_OTP_TEST_CODE:-}
      ONBOARDING_DATA_KEY: ${ONBOARDING_DATA_KEY:-}
      ONBOARDING_SUPPORT_MESSAGE: ${ONBOARDING_SUPPORT_MESSAGE:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - api-data:/data
      - api-uploads:/uploads
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - auth
  web:
    build: ./web
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      - auth
      - api
volumes:
  api-data:
  api-uploads:
